plugins {
    id 'base'
}

subprojects {
    apply plugin: 'java-library'
    group = rootProject.maven_group
    version = rootProject.mod_version
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}

// Compile the same sources in each loader's mapping/patch environment, then package
// them directly. No separate common mod or additional runtime library is required.
configure(subprojects.findAll { it.name != 'common' }) {
    base.archivesName = "chy-${project.name}"
    sourceSets.main {
        java.srcDirs(rootProject.file('common/src/main/java'), rootProject.file('common/src/minecraft/java'))
        resources.srcDir(rootProject.file('common/src/main/resources'))
    }
    processResources {
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand(version: project.version)
        }
    }
    jar {
        from(rootProject.file('LICENSE')) { rename { 'LICENSE_chy' } }
    }
}

tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
tasks.named('check') { dependsOn ':common:test' }

// Copy only installable artifacts; historical built/ releases remain untouched.
tasks.register('collectJars', Sync) {
    dependsOn ':fabric:remapJar', ':forge:jar', ':neoforge:jar', ':common:test'
    from(project(':fabric').tasks.named('remapJar'))
    from(project(':forge').tasks.named('jar'))
    from(project(':neoforge').tasks.named('jar'))
    into(layout.buildDirectory.dir('libs'))
}
