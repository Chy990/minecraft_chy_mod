plugins { id 'net.minecraftforge.gradle' version "${forge_gradle_version}" }

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir = rootProject.layout.projectDirectory.dir('run-forge-1.21.11')
            args '--mixin.config=chy.client.mixins.json'
        }
        register('client') {
            if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Forge 1.21.11 uses official names at runtime, so no SRG refmap is needed.
    // Keep common Mixin annotations remappable for Fabric's remapJar instead
    // of running Mixin's legacy SRG annotation processor without SRG mappings.
}
jar { manifest.attributes('MixinConfigs': 'chy.client.mixins.json') }

// Forge 61's classpath locator scans each directory as a separate mod. Run the
// packaged artifact so metadata, classes and shared resources are found together.
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('jar')
    doFirst {
        def outputs = sourceSets.main.output.files
        def launchFiles = classpath.files.findAll { !outputs.contains(it) }
        classpath = files(launchFiles, tasks.named('jar').flatMap { it.archiveFile })
    }
}
